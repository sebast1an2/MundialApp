{% extends 'admin_base.html' %}
{% block title %}Editar Fase — Admin{% endblock %}

{% block admin_content %}
<div class="d-flex align-items-center gap-3 mb-4">
  <a href="{{ url_for('admin.phases', event_id=phase.event_id) }}" class="btn-outline-custom">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h1 style="font-size: 1.8rem; margin: 0;">✏️ Editar Fase</h1>
</div>

<div class="card-custom" style="max-width: 500px;">
  <div class="card-header-custom">{{ phase.name }}</div>
  <div class="card-body-custom">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label-custom">Nombre *</label>
        <select name="name" class="form-control-custom" required>
          <option value="Fase de grupos" {% if phase.name == 'Fase de grupos' %}selected{% endif %}>Fase de grupos</option>
          <option value="Dieciseisavos" {% if phase.name == 'Dieciseisavos' %}selected{% endif %}>Dieciseisavos</option>
          <option value="Octavos" {% if phase.name == 'Octavos' %}selected{% endif %}>Octavos</option>
          <option value="Cuartos" {% if phase.name == 'Cuartos' %}selected{% endif %}>Cuartos</option>
          <option value="Semifinal" {% if phase.name == 'Semifinal' %}selected{% endif %}>Semifinal</option>
          <option value="Tercero y cuarto" {% if phase.name == 'Tercero y cuarto' %}selected{% endif %}>Tercero y cuarto</option>
          <option value="Final" {% if phase.name == 'Final' %}selected{% endif %}>Final</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="form-label-custom">Orden</label>
        <input type="number" name="phase_order" class="form-control-custom"
               value="{{ phase.phase_order }}" min="1">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn-primary-custom">
          <i class="bi bi-check-lg me-1"></i>Guardar
        </button>
        <a href="{{ url_for('admin.phases', event_id=phase.event_id) }}" class="btn-outline-custom">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
